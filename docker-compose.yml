# Oracle XE 21c para desenvolvimento local da VoxelSpace API.
# Imagem gvenzl/oracle-xe: não exige login no container-registry da Oracle.
#
#   docker compose up -d        # sobe o banco
#   docker compose logs -f db   # acompanha até "DATABASE IS READY TO USE!"
#   docker compose down -v      # derruba e apaga o volume
#
# Conexão (já refletida em appsettings.json):
#   User Id=voxel;Password=voxel123;Data Source=localhost:1521/XEPDB1

services:
  db:
    image: gvenzl/oracle-xe:21-slim
    container_name: voxelspace-oracle
    ports:
      - "1521:1521"
    environment:
      # Senha do SYS/SYSTEM.
      ORACLE_PASSWORD: oracle123
      # Cria automaticamente o usuário da aplicação no PDB XEPDB1.
      APP_USER: voxel
      APP_USER_PASSWORD: voxel123
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  oracle-data:
